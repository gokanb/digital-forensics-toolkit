<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="860" height="220" rx="14" fill="#0d1117"/>
  <text x="430" y="38" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">digital-forensics-toolkit</text>

  <g>
    <rect x="30" y="66" width="190" height="104" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="125" y="96" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">metadata_scanners</text>
    <text x="125" y="122" text-anchor="middle" fill="#8b949e" font-size="11">EXIF, PDF, Office,</text>
    <text x="125" y="138" text-anchor="middle" fill="#8b949e" font-size="11">video/audio, PE files</text>
  </g>
  <g>
    <rect x="235" y="66" width="175" height="104" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="322" y="96" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="700">hashing</text>
    <text x="322" y="122" text-anchor="middle" fill="#8b949e" font-size="11">file, directory tree,</text>
    <text x="322" y="138" text-anchor="middle" fill="#8b949e" font-size="11">disk hashing</text>
  </g>
  <g>
    <rect x="425" y="66" width="190" height="104" rx="10" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
    <text x="520" y="96" text-anchor="middle" fill="#f85149" font-size="14" font-weight="700">threat_intel</text>
    <text x="520" y="122" text-anchor="middle" fill="#8b949e" font-size="11">VirusTotal API,</text>
    <text x="520" y="138" text-anchor="middle" fill="#8b949e" font-size="11">passive DNS, scraping</text>
  </g>
  <g>
    <rect x="630" y="66" width="200" height="104" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="730" y="96" text-anchor="middle" fill="#d29922" font-size="14" font-weight="700">forensic_recipes</text>
    <text x="730" y="122" text-anchor="middle" fill="#8b949e" font-size="11">dir walking, logging,</text>
    <text x="730" y="138" text-anchor="middle" fill="#8b949e" font-size="11">multiprocessing, args</text>
